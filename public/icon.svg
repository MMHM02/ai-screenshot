<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.7)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Subtle top-left highlight -->
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#ring)" stroke-width="16" stroke-linecap="round"/>
  <!-- Middle ring -->
  <circle cx="256" cy="256" r="96" fill="none" stroke="white" stroke-width="8" opacity="0.6"/>
  <!-- Aperture blades - 6 blades for premium look -->
  <g opacity="0.85" fill="white">
    <path d="M256 116 L278 188 L256 178 L234 188 Z"/>
    <path d="M376 180 L326 224 L330 200 L314 216 Z"/>
    <path d="M376 332 L326 288 L330 312 L314 296 Z"/>
    <path d="M256 396 L234 324 L256 334 L278 324 Z"/>
    <path d="M136 332 L186 288 L182 312 L198 296 Z"/>
    <path d="M136 180 L186 224 L182 200 L198 216 Z"/>
  </g>
  <!-- Center circle with inner detail -->
  <circle cx="256" cy="256" r="36" fill="white" opacity="0.95"/>
  <circle cx="256" cy="256" r="20" fill="url(#bg)" opacity="0.3"/>
  <!-- AI sparkle accent - top right -->
  <g fill="white" opacity="0.9">
    <path d="M392 108 L397 122 L412 127 L397 132 L392 146 L387 132 L372 127 L387 122 Z"/>
    <circle cx="404" cy="156" r="4" opacity="0.6"/>
